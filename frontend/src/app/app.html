
<main class="min-h-dvh w-full flex flex-col lg:h-dvh lg:min-h-0">
   <app-header
      class="fixed inset-x-0 top-0 z-40 block shrink-0 transform-gpu backface-hidden will-change-transform transition-transform duration-400 ease-out lg:static lg:translate-y-0 lg:transform-none lg:will-change-auto"
      [class.invisible]="!mobileNavigationPainted()"
      [class.delay-350]="!mobileNavigationVisible()"
      [class.-translate-y-full]="!mobileNavigationVisible()" />
   <app-main-content class="flex-1 pt-20 pb-[calc(4rem+env(safe-area-inset-bottom))] lg:min-h-0 lg:overflow-hidden lg:pt-0 lg:pb-0" />
   <app-header
      placement="bottom"
      class="fixed inset-x-0 bottom-0 z-40 transform-gpu backface-hidden will-change-transform transition-transform duration-400 ease-out lg:hidden"
      [class.invisible]="!mobileNavigationPainted()"
      [class.translate-y-full]="!mobileNavigationVisible()" />
      <!-- <app-home-page class="h-full" /> -->
   <!-- </app-main-content> -->
</main>

<div class="flex min-h-[calc(100vh-5.75rem)] items-start justify-center bg-backgroundbeige px-6 py-10">
   <div class="w-full max-w-2xl">
      <div class="mb-6 flex items-end justify-between">
         <div>
            <h1 class="mt-1 text-4xl font-bold text-bookolive">SKANNA STRECKKOD</h1>
         </div>
      </div>

      <div class="rounded-full bg-[#EEE7D3] p-3 text-headerbrown">
         <div class="flex items-center gap-3">
            <i class="fa-solid fa-barcode ml-2 text-lg opacity-70"></i>
            <input
               id="isbn"
               type="text"
               inputmode="numeric"
               autocomplete="off"
               spellcheck="false"
               maxlength="13"
               placeholder="ISBN-nummer"
               class="w-full bg-transparent border-none outline-none text-lg tracking-widest placeholder:text-headerbrown/45"
               [value]="isbn()"
               (input)="updateIsbn($event)"
            />
         </div>
      </div>
   </div>
</div>

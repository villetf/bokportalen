@if (book$ | async; as book) {
   @let shelfBook = shelfBook$ | async;

   <app-book-page-mobile
      class="block lg:hidden"
      [book]="book"
      [shelfBook]="shelfBook"
      [shelfStatus]="shelfStatus()"
      [shelfRating]="shelfRating()"
      [shelfCopies]="shelfCopies()"
      (editRequested)="openEditView()"
      (resetRequested)="resetDeletedBook()"
      (shelfStatusChange)="shelfStatus.set($event)"
      (shelfRatingChange)="shelfRating.set($event)"
      (shelfCopiesChange)="shelfCopies.set($event)"
      (saveShelfRequested)="saveShelfChanges()"
      (removeShelfRequested)="removeFromShelf()" />

   <app-book-page-desktop
      class="hidden h-full lg:block"
      [book]="book"
      [shelfBook]="shelfBook"
      [booksByAuthor]="booksByAuthor()"
      [shelfStatus]="shelfStatus()"
      [shelfRating]="shelfRating()"
      [shelfCopies]="shelfCopies()"
      (editRequested)="openEditView()"
      (resetRequested)="resetDeletedBook()"
      (shelfStatusChange)="shelfStatus.set($event)"
      (shelfRatingChange)="shelfRating.set($event)"
      (shelfCopiesChange)="shelfCopies.set($event)"
      (saveShelfRequested)="saveShelfChanges()"
      (removeShelfRequested)="removeFromShelf()" />

   @if (editViewIsOpen()) {
      <app-edit-panel [closePanel]="closeEditView">
         <app-edit-book-form [book]="book" (editViewIsOpen)="editViewIsOpen.set($event)" (bookChange)="updateBook($event)"></app-edit-book-form>
      </app-edit-panel>
   }
}

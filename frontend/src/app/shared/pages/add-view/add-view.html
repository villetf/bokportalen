<div class="mx-auto flex min-h-full w-full max-w-4xl flex-col gap-10 px-5 py-8 sm:px-8 lg:py-12">
   <nav aria-label="Välj resurs att lägga till" class="w-full sm:max-w-xl sm:self-center">
      <div class="grid grid-cols-4 gap-2">
         @for (resource of resources; track resource.value) {
            <a
               routerLink="/add"
               [queryParams]="{ resource: resource.value }"
               [attr.aria-current]="selectedView() === resource.value ? 'page' : null"
               class="cabin-font flex min-h-11 items-center justify-center border-b-2 border-transparent px-1 py-2.5 text-sm font-medium text-bookolive/70 transition-colors duration-150 hover:text-bookolive focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-bookolive aria-[current=page]:border-bookolive/50 aria-[current=page]:font-semibold aria-[current=page]:text-bookolive"
            >
               {{ resource.label }}
            </a>
         }
      </div>
   </nav>

   <div class="min-w-0 flex-1">
      @switch (selectedView()) {
         @case ('book') {
            <app-add-book class="flex w-full justify-center [&>div]:w-full [&>div]:mr-0" />
         }
         @case ('author') {
            <app-add-author class="flex w-full justify-center [&>div]:w-full [&>div]:mr-0" />
         }
         @case ('genre') {
            <app-add-genre class="flex w-full justify-center [&>div]:w-full [&>div]:mr-0" />
         }
         @case ('language') {
            <app-add-language class="flex w-full justify-center [&>div]:w-full [&>div]:mr-0" />
         }
      }
   </div>
</div>
